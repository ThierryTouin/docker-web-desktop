version: '3.3'

services:
    web-desktop:
        build: 
            context: .
            dockerfile: dockerfile.webtop  
        container_name: webtop            
        shm_size: 1GB          
        ports:
            - 3000:3000
            - 3001:3001
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=Europe/London
            - SUBFOLDER=/
            - KEYBOARD=fr-fr-azerty
            - TITLE=Webtop #optional
        volumes:
            - ./config:/config
            - /var/run/docker.sock:/var/run/docker.sock
        restart: unless-stopped
        security_opt:
            - seccomp:unconfined    

            

